name: Daily Projects Sync

on:
  schedule:
    # 00:00 WIB (UTC+7) = 17:00 UTC
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate projects.json
        run: node scripts/fetch-projects.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add projects.json
          if git diff --staged --quiet; then
            echo "No changes in projects.json"
          else
            git commit -m "chore(data): auto-update projects.json [skip ci]"
            git push
          fi
