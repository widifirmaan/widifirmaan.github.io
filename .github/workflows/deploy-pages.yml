name: Deploy GitHub Pages

on:
  push:
    branches: ['master']
  issues:
    types: [labeled, unlabeled, edited, closed, reopened, deleted]
  workflow_run:
    workflows: ['Daily News Generation', 'Daily Projects Sync']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      (github.event_name != 'issues' || (
        github.event.issue.user.login == github.repository_owner &&
        (
          (github.event.action == 'labeled' && github.event.label.name == 'news:published') ||
          (github.event.action == 'unlabeled' && github.event.label.name == 'news:published') ||
          (
            contains(fromJSON('["edited","closed","reopened","deleted"]'), github.event.action) &&
            contains(github.event.issue.labels.*.name, 'news:published')
          )
        )
      ))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync published GitHub Issues articles (zero-push CMS)
        run: node scripts/sync-issue-articles.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ALLOWED_AUTHOR: ${{ github.repository_owner }}

      - name: Build static pages and sitemap
        run: node scripts/build-pages.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
